services:
  node-exporter:
    image: prom/node-exporter:v1.8.2
    ports: ["9100:9100"]
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9100/"]
      interval: 5s
      timeout: 3s
      retries: 12

  prometheus:
    image: prom/prometheus:v2.51.0
    volumes:
      - ./infra/prometheus.yml:/etc/prometheus/prometheus.yml
    ports: ["9090:9090"]
    depends_on:
      node-exporter:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9090/-/ready"]
      interval: 5s
      timeout: 3s
      retries: 12

  ai-service:
    build: ./ai-service
    ports: ["5000:5000"]
    # Prophet + CmdStan takes a long time to build first time in Docker
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s

  go-api:
    build: ./go-api
    ports: ["8080:8080"]
    environment:
      PROMETHEUS_URL: "http://prometheus:9090"
      AI_SERVICE_URL: "http://ai-service:5000"
    depends_on:
      prometheus:
        condition: service_healthy
      ai-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/healthz"]
      interval: 5s
      timeout: 3s
      retries: 12
