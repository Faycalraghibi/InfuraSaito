services:
  node-exporter:
    image: prom/node-exporter:v1.8.2
    ports: ["9100:9100"]
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9100/"]
      interval: 5s
      timeout: 3s
      retries: 12

  prometheus:
    image: prom/prometheus:v2.51.0
    volumes:
      - ./infra/prometheus.yml:/etc/prometheus/prometheus.yml
    ports: ["9090:9090"]
    depends_on:
      node-exporter:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9090/-/ready"]
      interval: 5s
      timeout: 3s
      retries: 12

  ai-service:
    build: ./ai-service
    # Internal service: reachable from the host for debugging only.
    ports: ["127.0.0.1:5000:5000"]
    # Prophet + CmdStan takes a long time to build first time in Docker
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: infurasaito
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-infurasaito}"
      POSTGRES_DB: infurasaito
    volumes:
      - forecasts:/var/lib/postgresql/data
    healthcheck:
      # Over TCP: the socket check passes during the image's init step, before the
      # server accepts the TCP connections the Go API uses.
      test: ["CMD", "pg_isready", "-h", "localhost", "-U", "infurasaito", "-d", "infurasaito"]
      interval: 5s
      timeout: 3s
      retries: 12

  go-api:
    build: ./go-api
    ports: ["8080:8080"]
    environment:
      PROMETHEUS_URL: "http://prometheus:9090"
      AI_SERVICE_URL: "http://ai-service:5000"
      DATABASE_URL: "postgres://infurasaito:${POSTGRES_PASSWORD:-infurasaito}@postgres:5432/infurasaito?sslmode=disable"
      # Optional: set API_KEY in your shell to require X-API-Key on /api/ routes.
      API_KEY: "${API_KEY:-}"
      # Optional: forecast alerts (see README "Alerts").
      ALERT_RULES: "${ALERT_RULES:-}"
      ALERT_WEBHOOK_URL: "${ALERT_WEBHOOK_URL:-}"
      TRAIN_INTERVAL: "${TRAIN_INTERVAL:-15m}"
    depends_on:
      prometheus:
        condition: service_healthy
      ai-service:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/healthz"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  forecasts:
