global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'node'
    static_configs:
      - targets: ['node-exporter:9100']

  # InfuraSaito's own metrics (request rates, latencies, breaker state, forecasts).
  - job_name: 'go-api'
    static_configs:
      - targets: ['go-api:8080']

  - job_name: 'ai-service'
    static_configs:
      - targets: ['ai-service:5000']
