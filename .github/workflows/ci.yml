name: CI / Integration Tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  go-unit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: go-api
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-go@v7
      with:
        go-version: '1.22'
        cache: false
    - name: Vet
      run: go vet ./...
    - name: Check formatting
      run: test -z "$(gofmt -l .)"
    - name: Test
      run: go test -race ./...

  py-unit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-service
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-python@v7
      with:
        python-version: '3.11'
        cache: pip
        cache-dependency-path: |
          ai-service/requirements.txt
          ai-service/requirements-dev.txt
    - name: Install
      run: pip install -r requirements.txt -r requirements-dev.txt
    - name: Test
      run: pytest -q

  test-mvp-stack:
    needs: [go-unit, py-unit]
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout Code
      uses: actions/checkout@v7

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    # Exposes the Actions cache runtime token so BuildKit can use type=gha caching,
    # which docker-compose.ci.yml uses for the heavy Prophet+CmdStan image layers.
    - name: Expose GitHub Actions runtime
      uses: crazy-max/ghaction-github-runtime@v4

    - name: Run Setup and Integration Test
      env:
        COMPOSE_FILE: docker-compose.yml:docker-compose.ci.yml
      run: |
        chmod +x ./clean_setup.sh
        ./clean_setup.sh

    - name: Print Logs on Failure
      if: failure()
      run: |
        echo "=== GO API LOGS ==="
        docker compose logs go-api || true
        echo "=== AI SERVICE LOGS ==="
        docker compose logs ai-service || true
        echo "=== PROMETHEUS LOGS ==="
        docker compose logs prometheus || true

    - name: Teardown
      if: always()
      run: |
        docker compose down -v
