name: CI / Integration Tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test-mvp-stack:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    # Exposes the Actions cache runtime token so BuildKit can use type=gha caching,
    # which docker-compose.ci.yml uses for the heavy Prophet+CmdStan image layers.
    - name: Expose GitHub Actions runtime
      uses: crazy-max/ghaction-github-runtime@v3

    - name: Run Setup and Integration Test
      env:
        COMPOSE_FILE: docker-compose.yml:docker-compose.ci.yml
      run: |
        chmod +x ./clean_setup.sh
        ./clean_setup.sh

    - name: Print Logs on Failure
      if: failure()
      run: |
        echo "=== GO API LOGS ==="
        docker compose logs go-api || true
        echo "=== AI SERVICE LOGS ==="
        docker compose logs ai-service || true
        echo "=== PROMETHEUS LOGS ==="
        docker compose logs prometheus || true

    - name: Teardown
      if: always()
      run: |
        docker compose down -v
